general {
    hide_cursor = true
    grace = 2
}

auth {
    pam:enabled = true
    pam:module = hyprlock
    fingerprint:enabled = true
    fingerprint:ready_message = Scan fingerprint to unlock
    fingerprint:present_message = Reading fingerprint…
    fingerprint:retry_delay = 350
}

background {
    monitor =
    color = rgba(11111bff)
    blur_passes = 2
}

label {
    monitor =
    text = cmd[update:1000] date +"%H:%M"
    color = rgba(cdd6f4ff)
    font_size = 72
    position = 0, 120
    halign = center
    valign = center
}

label {
    monitor =
    text = $FPRINTPROMPT
    color = rgba(a6adc8ff)
    font_size = 14
    position = 0, 18
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 320, 56
    outline_thickness = 2
    dots_size = 0.25
    outer_color = rgba(89b4faff)
    inner_color = rgba(1e1e2eff)
    font_color = rgba(cdd6f4ff)
    placeholder_text = Password…
    position = 0, -40
    halign = center
    valign = center
}
